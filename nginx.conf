server {
    listen 80;
    server_name _;
    return 301 https://$host:3080$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/quantrac.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantrac.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
