<!DOCTYPE html>
<html>
<head>
    <title>Test JSON Parse - allowedRoles</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test JSON Parse - allowedRoles from MySQL</h1>
    
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        // Test case 1: String từ MySQL JSON column (như bạn đã gửi)
        const mysqlResponse = {
            "allowed_roles": "[\"admin\",\"director\",\"manager\",\"employee\"]",
            "allow_manager_preview": 1,
            "allow_employee_preview": 0
        };
        
        function runTest(name, testFn) {
            const div = document.createElement('div');
            div.className = 'test';
            
            try {
                const result = testFn();
                div.className += ' success';
                div.innerHTML = `
                    <h3>✅ ${name}</h3>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
            } catch (error) {
                div.className += ' error';
                div.innerHTML = `
                    <h3>❌ ${name}</h3>
                    <pre>Error: ${error.message}\n${error.stack}</pre>
                `;
            }
            
            results.appendChild(div);
        }
        
        // Test 1: Parse string allowedRoles
        runTest('Test 1: Parse MySQL string to array', () => {
            let allowedRoles = mysqlResponse.allowed_roles;
            
            console.log('Original:', allowedRoles);
            console.log('Type:', typeof allowedRoles);
            
            if (typeof allowedRoles === 'string') {
                allowedRoles = JSON.parse(allowedRoles);
            }
            
            console.log('Parsed:', allowedRoles);
            console.log('Is array:', Array.isArray(allowedRoles));
            console.log('Includes employee:', allowedRoles.includes('employee'));
            
            return {
                original: mysqlResponse.allowed_roles,
                parsed: allowedRoles,
                isArray: Array.isArray(allowedRoles),
                length: allowedRoles.length,
                includesEmployee: allowedRoles.includes('employee'),
                includesAdmin: allowedRoles.includes('admin')
            };
        });
        
        // Test 2: Simulate LinkManager logic
        runTest('Test 2: LinkManager parsing logic', () => {
            let permissions = {...mysqlResponse};
            
            // Same logic as LinkManager.jsx
            if (permissions && permissions.allowed_roles) {
                if (typeof permissions.allowed_roles === 'string') {
                    const parsed = JSON.parse(permissions.allowed_roles);
                    permissions = {
                        ...permissions,
                        allowedRoles: parsed  // Rename to camelCase
                    };
                    delete permissions.allowed_roles;  // Remove snake_case
                }
            }
            
            return {
                permissions: permissions,
                isArray: Array.isArray(permissions.allowedRoles),
                canEmployeeAccess: permissions.allowedRoles?.includes('employee')
            };
        });
        
        // Test 3: Check access logic
        runTest('Test 3: canAccessLink logic', () => {
            const user = { role: 'employee', username: 'Longrd' };
            
            let permissions = {...mysqlResponse};
            if (typeof permissions.allowed_roles === 'string') {
                permissions.allowed_roles = JSON.parse(permissions.allowed_roles);
            }
            
            const linkPermissions = {
                allowedRoles: permissions.allowed_roles
            };
            
            const hasAccess = linkPermissions.allowedRoles.includes(user.role);
            
            return {
                userRole: user.role,
                allowedRoles: linkPermissions.allowedRoles,
                hasAccess: hasAccess,
                shouldBeTrue: hasAccess === true ? '✅ CORRECT' : '❌ WRONG'
            };
        });
        
        // Test 4: Edge cases
        runTest('Test 4: Edge case - Already array', () => {
            const alreadyArray = {
                allowed_roles: ["admin", "director", "employee"]
            };
            
            let allowedRoles = alreadyArray.allowed_roles;
            
            if (typeof allowedRoles === 'string') {
                allowedRoles = JSON.parse(allowedRoles);
            }
            
            return {
                wasString: false,
                isArray: Array.isArray(allowedRoles),
                includesEmployee: allowedRoles.includes('employee')
            };
        });
        
        // Test 5: Full workflow
        runTest('Test 5: Full workflow - API → Parse → Check', () => {
            // 1. API response (from backend)
            const apiResponse = {
                allowed_roles: "[\"admin\",\"director\",\"manager\",\"employee\"]",
                allow_manager_preview: 1,
                allow_employee_preview: 0
            };
            
            // 2. Parse in linksApi.js (just pass through)
            const link = {
                id: 5,
                title: "Khảo sát khách hàng",
                permissions: apiResponse
            };
            
            // 3. Parse in LinkManager.jsx
            let permissions = link.permissions;
            if (permissions && permissions.allowed_roles && typeof permissions.allowed_roles === 'string') {
                permissions = {
                    ...permissions,
                    allowedRoles: JSON.parse(permissions.allowed_roles)
                };
            }
            
            // 4. Check access in authContext.js
            const user = { role: 'employee' };
            const hasAccess = permissions.allowedRoles?.includes(user.role);
            
            return {
                step1_apiResponse: apiResponse,
                step2_linkWithPermissions: link,
                step3_parsedPermissions: permissions,
                step4_accessCheck: {
                    userRole: user.role,
                    allowedRoles: permissions.allowedRoles,
                    hasAccess: hasAccess,
                    result: hasAccess ? '✅ Employee CAN access' : '❌ Employee CANNOT access'
                }
            };
        });
    </script>
</body>
</html>
